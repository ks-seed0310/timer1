<!doctype html>
<html lang=ja>
    <head>
        <meta charset=utf-8>
        <title>デジタルタイマー / Digital Timer v1.2</title>
        <style>
            html{
                width:100vw;
                height:100vh;
            }
            body{
                max-width:100%;
                min-height:100vh;
            }
            .boldtext{
                font-family:system-ui,sans-serif !important;
                font-weight:900;
            }
            #timer_grtop{
                text-align:center;
                height:auto;
                display:inline-block;
            }
            #timer_top{
                width:95vw;
                --width:90vw;
                max-width:95vw;
                height:100%;
                --sub:8px;
                display:inline-block;
            }
            #timer_top.active2.lastlen2{
                --fs:calc(var(--width)/2.8);
                font-size:var(--fs)
            }
            #timer_top.active2.lastlen3{
                --fs:calc(var(--width)/3.4);
                font-size:var(--fs)
            }
            #timer_top.active2.lastlen4{
                --fs:calc(var(--width)/4.0);
                font-size:var(--fs)
            }
            #timer_top.active3.lastlen2{
                --fs:calc(var(--width)/4.2);
                font-size:var(--fs)
            }
            #timer_top.active3.lastlen3{
                --fs:calc(var(--width)/4.8);
                font-size:var(--fs)
            }
            #timer_top.active3.lastlen4{
                --fs:calc(var(--width)/5.4);
                font-size:var(--fs)
            }
            .btn{
                border: 4px solid #afb1b5;
                border-radius:32px;
                font-size:32px;
                padding:8px 16px;
                cursor:pointer;
                margin-top:16px;
                margin-bottom:8px;
                font-family:system-ui,sans-serif;
                background-color:#fafafa;
                color:#202020;
            }
            .btn[disabled]{
                border: 4px solid rgba(143,145,149,0.2);
                background-color:rgba(238,238,238,0.2);
                color:rgba(32,32,32,0.2);
                cursor:not-allowed;
            }
            .btnsmall{ /*.btnsmallは.btnを1/4程度のサイズにする。(fontSizeでは1/2)　その代わり、文字の色を0x20(32)程度増やすこと。(線も細くなるから太くする。)#aabbccの場合は、#8899aa(rgb各項目を0x20減らす)*/
                border: 2px solid #8f9195;
                border-radius:24px;
                font-size:16px;
                padding:4px 8px;
                cursor:pointer;
                margin-top:8px;
                margin-bottom:4px;
                font-family:system-ui,sans-serif;
                background-color:#fafafa;
                color:#080808;
            }
            .btnsmall[disabled]{
                border: 2px solid rgba(111,113,117,0.2);
                background-color:rgba(206,206,206,0.2);
                color:rgba(8,8,8,0.2);
                cursor:not-allowed;
            }
            #setting{
                width:85%;
                height:85%;
                padding:0px;
                border-radius:24px;
                border:0px;
            }
            #setting::backdrop{
                background:rgba(0,0,0,0.5)
            }
            #setting_top{
                --max-width:100cqw; /*vwは全体の横幅、vqwは親要素の横幅*/
                --padding:16px;
                max-width:calc(var(--max-width)-var(--padding)*2);
                width:calc(var(--max-width)-var(--padding)*2);
                padding:var(--padding);
                max-height:100%;
                height:100%;
                overflow-y:auto;
                border-radius:24px;
                box-shadow:inset 0 0 0 2px #dfe1e5;
            }
            #setting_besideLineUp{
                width:100%;
                height:max-content;
                display:flex;
                justify-content:flex-start;
                flex-wrap:wrap;
            }
            .settingDetails{
                cursor:pointer;
                width:100%;
                padding-bottom:8px;
            }
            .inputNumberBox{
                border: 4px solid #dfe1e5;
                width:96px;
                font-size:24px;
                border-radius: 8px;
                padding: 8px 16px;
                margin: 0px;
                font-family:'Noto Sans JP' !important;
                margin-top:8px;
                margin-bottom:8px;
            }
            form{
                cursor:default;
            }
            #powerwash_screen{
                width:85%;
                height:85%;
                padding:0px;
                border-radius:24px;
                border:0px;
            }
            #powerwash_screen_top{
                --max-width:100cqw; /*vwは全体の横幅、vqwは親要素の横幅*/
                --padding:16px;
                max-width:calc(var(--max-width)-var(--padding)*2);
                width:calc(var(--max-width)-var(--padding)*2);
                padding:var(--padding);
                max-height:100%;
                height:100%;
                overflow-y:auto;
                border-radius:24px;
                box-shadow:inset 0 0 0 2px #dfe1e5;
            }
        </style>
    </head>
    <body>
        <div>
            <div>
                <div id="timer_view">
                    <div id="timer_grtop">
                        <span id="timer_top" class="boldtext active3 lastlen2"><span id="timer_hour">00</span><span id="hour_min_join"><sp-e s=8 mirror>:</sp-e></span><span id="timer_minute">00</span><span id="min_sec_join"><sp-e s=8 mirror>:</sp-e></span><span id="timer_second">00</span></span>
                    </div>
                </div>
                <div id="menuTop">
                    <button class="btn" id="start" title="タイマーを開始します。">開始</button>
                    <sp-e s=8></sp-e>
                    <button class="btn" id="stop" title="タイマーを停止します。">停止</button>
                    <sp-e s=8></sp-e>
                    <button class="btn" id="reset" title="タイマーの制限時間を設定時間にリセットします。">リセット</button>
                    <sp-e s=8></sp-e>
                    <button class="btn" id="to_setting" title="設定画面を開きます。">設定</button>
                </div>
            </div>
            <dialog id="setting">
                <div id="setting_top">
                    <div id="setting_besideLineUp">
                        <details class="settingDetails" open>
                            <summary title="タイマーの制限時間を指定します。">制限時間設定</summary>
                            <form id="setting_timelimit" action="#" onsubmit="event.preventDefault()">
                                <label>
                                    <input type="number" name="timelimit" id="setting_timelimit_h" class="inputNumberBox" min=0 value=0 />
                                    <sp-e s=8 style="cursor:text;" mirror>時間</sp-e>
                                </label>
                                <label>
                                    <input type="number" name="timelimit" id="setting_timelimit_m" class="inputNumberBox" min=0 value=0 />
                                    <sp-e s=8 style="cursor:text;" mirror>分</sp-e>
                                </label>
                                <label>
                                    <input type="number" name="timelimit" id="setting_timelimit_s" class="inputNumberBox" min=0 value=0 />
                                    <sp-e s=8 style="cursor:text;" mirror>秒</sp-e>
                                </label>
                            </form>
                        </details>
                        <details class="settingDetails">
                            <summary title="テンプレートから制限時間を選択、クリックで時間追加などができます。">クイックメニュー</summary>
                            <form id="setting_quickmenu" action="#" onsubmit="event.preventDefault()">
                                <button onclick="btnpress(this);template_lim(0,0,0,false)" class="btnsmall">リセット</button>
                                <br />
                                <button onclick="btnpress(this);template_lim(0,0,30,false)" class="btnsmall">30秒</button>
                                <button onclick="btnpress(this);template_lim(0,1,0,false)" class="btnsmall">1分</button>
                                <button onclick="btnpress(this);template_lim(0,3,0,false)" class="btnsmall">3分</button>
                                <button onclick="btnpress(this);template_lim(0,5,0,false)" class="btnsmall">5分</button>
                                <button onclick="btnpress(this);template_lim(0,10,0,false)" class="btnsmall">10分</button>
                                <button onclick="btnpress(this);template_lim(0,30,0,false)" class="btnsmall">30分</button>
                                <br />
                                <button onclick="btnpress(this);template_lim(0,0,30,true)" class="btnsmall">+30秒</button>
                                <button onclick="btnpress(this);template_lim(0,1,0,true)" class="btnsmall">+1分</button>
                                <button onclick="btnpress(this);template_lim(0,3,0,true)" class="btnsmall">+3分</button>
                                <button onclick="btnpress(this);template_lim(0,5,0,true)" class="btnsmall">+5分</button>
                                <button onclick="btnpress(this);template_lim(0,10,0,true)" class="btnsmall">+10分</button>
                                <button onclick="btnpress(this);template_lim(0,30,0,true)" class="btnsmall">+30分</button>
                                <br />
                                <button onclick="btnpress(this);template_lim(0,0,-30,true)" class="btnsmall">-30秒</button>
                                <button onclick="btnpress(this);template_lim(0,-1,0,true)" class="btnsmall">-1分</button>
                                <button onclick="btnpress(this);template_lim(0,-3,0,true)" class="btnsmall">-3分</button>
                                <button onclick="btnpress(this);template_lim(0,-5,0,true)" class="btnsmall">-5分</button>
                                <button onclick="btnpress(this);template_lim(0,-10,0,true)" class="btnsmall">-10分</button>
                                <button onclick="btnpress(this);template_lim(0,-30,0,true)" class="btnsmall">-30分</button>
                            </form>
                        </details>
                        <details class="settingDetails">
                            <summary title="タイマーの表示形式を切り替えます。">タイマー表示設定</summary>
                            <form id="setting_timerview" action="#" onsubmit="event.preventDefault()">
                                <label><input type="radio" name="timerview" value="auto" checked />自動</label>
                                <label><input type="radio" name="timerview" value="hms" />hh:mm:ss</label>
                                <label><input type="radio" name="timerview" value="ms" />mm:ss</label>
                            </form>
                        </details>
                        <details class="settingDetails">
                            <summary title="タイマーが終了したときのアラート音や音量などを設定します。">サウンド設定</summary>
                            <form id="setting_sound">
                                <input type=range min=0 max=1 step=0.05 value=0.5 name="soundvolume" style="width:60%" />
                                <span id="setting_soundvolume_print">現在の設定値: 50%</span>
                                <span style="font-size:24px;display:flex;align-items:center;" />
                                    <label><input type="radio" name="soundselect" value="s1" checked />サウンド1</label><sp-e s=8 template="volumeIcon1" childstyle="display:flex;align-items:center;" title="このサウンドを再生する" onclick="sounds.s1.play()" style="cursor:pointer;"></sp-e>
                                </span>
                            </form>
                        </details>
                        <details class="settingDetails">
                            <summary title="タイマーが終了したときのアラート音の継続時間を設定します。">アラート継続時間</summary>
                            <span>分数で指定</span>
                            <form id="setting_repeattime">
                                <input type=range min=0.5 max=30 step=0.5 value=1 name="repeattime" style="width:60%;" />
                                <span id="setting_repeattime_print">現在の設定値: 1分</span>
                            </form>
                        </details>
                        <details class="settingDetails">
                            <summary title="タイマーサイズ調整">サイズ調整</summary>
                            <p>開発中</p>
                        </details>
                        <details class="settingDetails">
                            <summary title="データ消去などの保存データ関連の設定です。">データ</summary>
                            <button class="btn" id="powerwash" style="font-size:1rem;">データ全消去</button>
                        </details>
                        <button class="btn" id="to_home" style="font-size:1rem;" title="タイマーの画面に戻ります。">戻る</button>
                    </div>
                </div>
            </dialog>
            <dialog id="powerwash_screen">
                <div id="powerwash_screen_top">
                    <span>削除中...</span>
                    <br />
                    <br />
                    <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="powerwash_screen_rorateElement" style="display:flex;align-items:center;stroke:green;zoom:2;" onchange=(function(){i=Math.floor(Math.random()*8);j=Math.floor(Math.random()*8);window.stopKey=setInterval(function(){this.style.rotate=(j%360+"deg");j+=(i+=0.125)}.bind(this),20)}).call(this) onclick=g('powerwash_screen_secret_contents01').style.display='block'><circle cx="12" cy="12" r="10"></circle><line x1="6" y1="12" x2="9" y2="16"></line><line x1="9" y1="16" x2="18" y2="9"></line</svg>
                    <br />
                    <span id="powerwash_screen_secret_contents01" style="display:none">クソ手抜きローディングスピナー風の意味分からない回転(スクショしてみて)</span>
                </div>
            </dialog>
        </div>
        <script>
            async function btnpress(el){
                if (el.disabled!=undefined){
                    el.disabled=true
                }
                await new Promise(r=>setTimeout(r,500))
                if (el.disabled!=undefined){
                    el.disabled=false
                }
            }
            const sounds_url={
                s1:"https://ks-seed0310.github.io/audio_storage/kitchen_timer_alarm.txt",
            }
            const sounds_ts={
                s1:"kitchen_timer_alarm",
            }
            const sounds={
                
            }
            const sounds_k=[]
            async function clockSoundLoad(){
                const su=Object.entries(sounds_url)
                const cache=await caches.open("sound_data")
                const param=new URLSearchParams(location.search)
                const reload=param.get("reload")!=null
                for (const [key,url] of su){
                    try{
                        const k=("/audio_storage/audioCache/"+sounds_ts[key])
                        
                        if (!navigator.onLine&&!await cache.match(k)){
                            console.log(1)
                            if (window.soundsOfflinePackage&&soundsOfflinePackage.s1){
                                sounds[key]=new Audio(soundsOfflinePackage.s1)
                                sounds_k.push(key)
                            }else{
                                throw new Error("オフライン中かつキャッシュが存在しません。ネットワークに接続してください。")
                            }
                        }else if(navigator.onLine&&(reload||!await cache.match(k))){
                            console.log(2)
                            const re=await fetch(url)
                            if (location.protocol.includes("http")){
                                cache.put(k,re)
                            }
                            sounds[key]=new Audio(await re.text())
                            sounds_k.push(key)
                        }else{
                            console.log(3)
                            sounds[key]=new Audio(await (await cache.match(k)).text())
                            sounds_k.push(key)
                        }
                    }catch(e){
                        console.warn(e)
                    }
                }
            }
            async function playsound(audio){
                if (!audio)return false
                return new Promise((resolve,reject)=>{
                    audio.onended=()=>{
                        audio.onended=null
                        audio.onerror=null
                        resolve(true)
                    }
                    audio.onerror=(e)=>{
                        audio.onended=null
                        audio.onerror=null
                        reject(e)
                    }
                    audio.play().catch(e=>{
                        audio.onended=null
                        audio.onerror=null
                        reject(e)
                    })
                })
            }
            function stopsound(audio){
                if (!audio)return false
                audio.pause()
                audio.currentTime=0
                audio.onended=null
                audio.onerror=null
            }
            function volumechange(audio){
                audio.volume=cf.volume
            }
            class HTMLSpaceElement extends HTMLElement{
                connectedCallback(){
                    const template_ts={
                        volumeIcon1:`<svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="11" fill="#619fcf" /><path d="M10.5 6L6.5 9.5H3.5v5h3l4 3.5V6z" fill="#ffffff" /><g fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 9a4 4 0 0 1 0 6" /><path d="M17.5 6.5a8 8 0 0 1 0 11" /></g></svg>`,
                    }
                    const size=this.getAttribute("s")
                    const mirror=this.getAttribute("mirror")!==null
                    const childstyle=this.getAttribute("childstyle")??""
                    const template=this.getAttribute("template")
                    const template_res=template_ts[template]??""
                    const add=(function(){
                        if (!isNaN(Number(size))){
                            return "px"
                        }else{
                            return ""
                        }
                    })()
                    this.innerHTML=`<span style="padding-left:${size}${add};padding-right:${mirror?size:0}${mirror?add:"px"};${childstyle}" class="HTMLSpaceElement_node">${this.innerHTML}${template_res}</span>`
                }
            }
            customElements.define("sp-e",HTMLSpaceElement)

            const g=_=>document.getElementById(_)
            const timer={
                top:g("timer_top"),
                hour:g("timer_hour"),
                min:g("timer_minute"),
                sec:g("timer_second"),
                hourMin:g("hour_min_join"), //HH:MMの:部分
                minSec:g("min_sec_join"), //MM:SSの:部分
            }
            const cf={
                active:0, //0:auto(実行時に決める) 1:なし 2:ms 3:hms
                hour:0,
                min:0,
                sec:0,
                volume:0.5,
                timerScore:0, //timerScore=hour*3600+min*60+sec
                timerStop:0,
                usesoundcode:"s1",
                repeattime_s:60,
                item_maxmin:{h:[0,9999],m:[0,59],s:[0,59]},
            }
            const maincache={
                start:0,
                sub:0,
                firststart:true, //リセットしてから一番最初の開始:true else:false
                stoped:true, // 止まっている/アラート音がなっている(タイマー自体が止まっている):true else:false
                finished:true, //タイマーを停止した(アラート音を止めた):true else:false
            }
            function maincacheReset(){
                maincache.start=0
                maincache.sub=0
                maincache.firststart=true
                maincache.stoped=true
                maincache.finished=true
            }
            function toTimerActive2(repl=true){
                timer.hourMin.style.display="none"
                timer.hour.style.display="none"
                timer.top.classList.remove("active3")
                timer.top.classList.add("active2")
                if(repl)cf.active=2
                cf.item_maxmin={h:[0,0],m:[0,9999],s:[0,59]}
            }
            function toTimerActive3(repl=true){
                timer.hourMin.style.display=""
                timer.hour.style.display=""
                timer.top.classList.remove("active2")
                timer.top.classList.add("active3")
                if(repl)cf.active=3
                cf.item_maxmin={h:[0,9999],m:[0,59],s:[0,59]}
            }
            async function timer_finish(){
                const audio=sounds[cf.usesoundcode]
                const startTime=performance.now()
                await new Promise(async r=>{
                    for (let i=0;i<65536;i++){
                        let played=false
                        playsound(audio).then(()=>{played=true})

                        await new Promise(r2=>{
                            const stop=setInterval(()=>{
                                if (maincache.finished||played||((performance.now()-startTime)/1000>cf.repeattime_s)){
                                    stopsound(audio)
                                    clearInterval(stop)
                                    r2()
                                }
                            },200)
                        })
                        if (!played||maincache.finished){
                            stopsound(audio)
                            break
                        }
                    }
                    r()
                })
                //console.log("end",(performance.now()-startTime)/1000)
            }
            function timer_render(Score,renderMode,activer){
                const e=timer.top
                const r=renderMode??(function(){
                    if (e.classList.contains("lastlen2")){
                        return 2
                    }else if (e.classList.contains("lastlen3")){
                        return 3
                    }else if (e.classList.contains("lastlen4")){
                        return 4
                    }
                })()//render Mode
                const active=activer||(function(){
                    if (cf.active===0||activer===0){
                        if (Math.floor(Score/3600)===0){
                            toTimerActive2(false)
                            return 2
                        }else{
                            toTimerActive3(false)
                            return 3
                        }
                    }else{
                        return cf.active
                    }
                })()
                const all=(function(){
                    if (Score!=undefined){
                        if (active===2){
                            return [0,Math.floor(Score/60),Score%60]
                        }else if (active===3){
                            return [Math.floor(Score/3600),Math.floor(Score%3600/60),Score%60]
                        }
                    }else{
                        return [cf.hour,cf.min,cf.sec]
                    }
                })()
                const [h,m,s]=all.map(String)

                timer.sec.textContent=s.padStart(2,0)
                timer.min.textContent=m.padStart(((active===2)?r:2),0)
                timer.hour.textContent=h.padStart(((active===3)?r:2),0)
            }
            async function timer_main(){
                const e=timer.top
                const r=(function(){
                    if (e.classList.contains("lastlen2")){
                        return 2
                    }else if (e.classList.contains("lastlen3")){
                        return 3
                    }else if (e.classList.contains("lastlen4")){
                        return 4
                    }
                })()//render Mode
                const active=(function(){
                    console.log(cf.active,cf.hour)
                    if (cf.active===0){
                        if (cf.hour==="0"||cf.hour===0){
                            toTimerActive2(false)
                            return 2
                        }else{
                            toTimerActive3(false)
                            return 3
                        }
                    }else{
                        return cf.active
                    }
                })()
                cf.timerScore=cf.hour*3600+cf.min*60+cf.sec
                if (maincache.firststart){
                    maincache.start=performance.now()
                    maincache.firststart=false
                }else{
                    maincache.start=performance.now()-maincache.sub
                }
                maincache.stoped=false
                maincache.finished=false
                let lastscore
                cf.timerStop=setInterval(()=>{
                    const score=cf.timerScore-((performance.now()-maincache.start)/1000)
                    lastscore=score
                    //console.log(score,performance.now(),maincache.start,maincache.sub)
                    timer_render(Math.round(score),r,active)
                    if (score<0||maincache.stoped){
                        maincache.stoped=true
                        timer_render(0,r,active)
                        clearInterval(cf.timerStop)
                    }
                },100)
                await new Promise(r=>{
                    const stop=setInterval(()=>{
                        if (maincache.stoped){
                            clearInterval(stop)
                            r()
                        }
                    },100)
                })
                maincache.sub=(cf.timerScore-lastscore)*1000
                //console.log("maincache sub:",maincache.sub)
                if (lastscore<0){
                    timer_render(0,r,false)
                    await timer_finish()
                    maincache.finished=true
                }
            }
            function timer_main_boot(bootmode=false){
                let bootbad
                if (bootmode){
                    const elm=[...setel.timelimit.timelimit]
                    const lim=[...setel.timelimit.timelimit].map(x=>Number(x.value))
                    const col={ok:"green",ng:"red"}
                    const key=["h","m","s"]
                    const log=[]
                    for (let i=0;i<3;i++){
                        const el=elm[i]
                        const inp=lim[i]
                        const limit=cf.item_maxmin[key[i]]
                        if (limit[0]<=inp&&inp<=limit[1]){
                            el.style.borderColor=col.ok
                            log.push(true)
                        }else{
                            el.style.borderColor=col.ng
                            log.push(false)
                        }
                    }
                    if (log.some(x=>x===false))bootbad=true
                    cf.hour=lim[0]
                    cf.min=lim[1]
                    cf.sec=lim[2]
                }
                maincacheReset()
                let tg=0
                let active=cf.active
                if (cf.active===0){
                    if (cf.hour===0){
                        tg=cf.min
                        toTimerActive2(false)
                        active=2
                    }else{
                        tg=cf.hour
                        toTimerActive3(false)
                        active=3
                    }
                }else if (cf.active===2){
                    tg=cf.min
                    active=2
                }else if (cf.active===3){
                    tg=cf.hour
                    active=3
                }
                if (bootbad)return false
                const tgs=String(tg)
                let rendermode;
                timer.top.classList.remove("lastlen2","lastlen3","lastlen4")
                if (tgs.length===1||tgs.length===2){
                    timer.top.classList.add("lastlen2")
                    rendermode=2
                }else if (tgs.length===3){
                    timer.top.classList.add("lastlen3")
                    rendermode=3
                }else if (tgs.length===4){
                    timer.top.classList.add("lastlen4")    
                    rendermode=4
                }
                timer_render(cf.hour*3600+cf.min*60+cf.sec,rendermode,active)
            }
            function limupdate(){
                const lim=cf.item_maxmin
                const el=[...setel.timelimit.timelimit]
                const key=["h","m","s"]
                for (let i=0;i<3;i++){
                    const e=el[i]
                    const l=lim[key[i]]
                    e.min=l[0]
                    e.max=l[1]
                }
            }

            const menuel={
                start:g("start"),
                stop:g("stop"),
                reset:g("reset"),
                setting:g("to_setting"),
                home:g("to_home"),
                powerwash:g("powerwash"),
            }
            const setel={
                main:g("setting"),
                timerview:g("setting_timerview"),
                timelimit:g("setting_timelimit"),
                timelimit_h:g("setting_timelimit_h"),
                timelimit_m:g("setting_timelimit_m"),
                timelimit_s:g("setting_timelimit_s"),
                soundmain:g("setting_sound"),
                soundvolumeprint:g("setting_soundvolume_print"),
                repeattime:g("setting_repeattime"),
                repeattime_print:g("setting_repeattime_print"),
                template:g("setting_quickmenu"),
            }
            menuel.start.addEventListener("click",e=>{
                menuel.start.disabled=true
                menuel.stop.disabled=false
                timer_main()
            })
            menuel.stop.addEventListener("click",e=>{
                menuel.start.disabled=false
                menuel.stop.disabled=true
                maincache.stoped=true
                clearInterval(cf.timerStop)
                if (maincache.stoped&&!maincache.finished){
                    maincache.finished=true
                }
            })
            menuel.reset.addEventListener("click",e=>{
                timer_main_boot()
            })
            menuel.setting.addEventListener("click",e=>{
                setel.main.showModal()
            })
            menuel.home.addEventListener("click",e=>{
                setel.main.close()
            })
            menuel.powerwash.addEventListener("click",async e=>{
                if (confirm("全保存データを削除し、初期化しますか?初期化すると、この「設定」から設定されたデータ(サウンド、タイマー表示、制限時間、アラート継続時間など)が全て消去されます。初期化後は、再登録が必要となります。\n\n本当に、初期化しますか?")){
                    try{
                        clearInterval(autosave_stop)
                        g("powerwash_screen").showModal()
                        g("powerwash_screen_rorateElement").dispatchEvent(new Event("change"))
                        await new Promise(r=>setTimeout(r,12000)) //autosaveが5秒ごとのため、5秒+aは待つこと。
                        localStorage.removeItem("/timer/v1/mainsave/cf")
                        alert("データ削除が完了しました。初期化内容反映のため、再読み込みが行われます。")
                        location.reload()
                    }catch(e){
                        alert("データ削除に失敗しました。")
                    }
                }
            })
            setel.main.addEventListener("click",e=>{
                if (e.target===setel.main){
                    setel.main.close()
                }
            })
            setel.timerview.addEventListener("change",e=>{
                const mode=setel.timerview.timerview.value
                //console.log("change!")
                if (mode==="auto"){
                    cf.active=0
                }else if (mode==="hms"){
                    toTimerActive3()
                }else if (mode==="ms"){
                    toTimerActive2()
                }
                limupdate()
                backup()
            })
            setel.timelimit_h.addEventListener("input",e=>{
                e.target.value=Number(e.target.value)
                timer_main_boot(true)
            })
            setel.timelimit_m.addEventListener("input",e=>{
                e.target.value=Number(e.target.value)
                timer_main_boot(true)
            })
            setel.timelimit_s.addEventListener("input",e=>{
                e.target.value=Number(e.target.value)
                timer_main_boot(true)
            })
            function template_lim(h,m,s,add=false){
                const H=setel.timelimit_h
                const M=setel.timelimit_m
                const S=setel.timelimit_s
                H.value=add?(Number(H.value)+h):h
                M.value=add?(Number(M.value)+m):m
                S.value=add?(Number(S.value)+s):s
                timer_main_boot(true)
            }
            setel.soundmain.addEventListener("input",e=>{
                if (e.target.name==="soundvolume"){
                    //音量調整
                    cf.volume=Number(e.target.value)
                    setel.soundvolumeprint.textContent="現在の設定値: "+Math.floor(e.target.value*100)+"%"
                    sounds_k.forEach(name=>volumechange(sounds[name]))
                    backup()
                }else if (e.target.name==="soundselect"){
                    //サウンド決定処理
                    cf.usesoundcode=e.target.value
                    backup()
                }
            })
            setel.repeattime.addEventListener("input",e=>{
                cf.repeattime_s=Number(e.target.value)*60
                setel.repeattime_print.textContent="現在の設定値: "+e.target.value+"分"
                backup()
            })

            window.soundsOfflinePackage=soundsOfflinePackage
            !async function(){
                await clockSoundLoad()
                
                const c=JSON.parse(localStorage.getItem("/timer/v1/mainsave/cf"))
                if (!c)return;

                setel.timerview.timerview.value=(function(){
                    const m=c.active
                    if(m===0)return"auto"
                    if(m===1)return"ignore"
                    if(m===2)return"ms"
                    if(m===3)return"hms"
                })()
                setel.timerview.dispatchEvent(new Event("change"))
                if (c.active){
                    cf.active=c.active
                }
                if (c.hour){
                    cf.hour=c.hour
                    setel.timelimit_h.value=c.hour
                }
                if (c.min){
                    cf.min=c.min
                    setel.timelimit_m.value=c.min
                }
                if (c.sec){
                    cf.sec=c.sec
                    setel.timelimit_s.value=c.sec
                }
                if (c.volume){
                    cf.volume=c.volume
                    setel.soundmain.soundvolume.value=c.volume
                    setel.soundvolumeprint.textContent="現在の設定値: "+Math.floor(c.volume*100)+"%"
                    sounds_k.forEach(name=>volumechange(sounds[name]))
                }
                if (c.timerScore){
                    cf.timerScore=c.timerScore
                }
                if (c.timerStop){
                    cf.timerStop=c.timerStop
                }
                if (c.repeattime_s){
                    cf.repeattime_s=c.repeattime_s
                    setel.repeattime.repeattime.value=(cf.repeattime_s/60).toFixed(1)
                    setel.repeattime_print.textContent="現在の設定値: "+(cf.repeattime_s/60).toFixed(1)+"分"
                }
                if (c.usesoundcode){
                    cf.usesoundcode=c.usesoundcode
                    setel.soundmain.soundselect.value=c.usesoundcode
                }
                if (c.item_maxmin){
                    cf.item_maxmin=c.item_maxmin
                }
                
                setel.timerview.dispatchEvent(new Event("change"))
                timer_main_boot()
            }()
            function backup(){
                localStorage.setItem("/timer/v1/mainsave/cf",JSON.stringify(cf,0,0))
            }
            const autosave_stop=setInterval(backup,5000)
            const buttonsys_stop=setInterval(()=>{
                if (maincache.finished){
                    menuel.start.disabled=false
                    menuel.reset.disabled=false
                    menuel.stop.disabled=true
                }else{
                    menuel.start.disabled=true
                    menuel.reset.disabled=true
                    menuel.stop.disabled=false
                }
                if (timer.top.textContent==="00:00:00"||timer.top.textContent==="000:00:00"||timer.top.textContent==="0000:00:00"){
                    menuel.start.disabled=true
                }
                if (maincache.firststart){
                    menuel.start.textContent="開始"
                }else{
                    menuel.start.textContent="再開"
                }
            },50)
        </script>
